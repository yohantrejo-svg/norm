<svg viewBox="0 0 300 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ciclo de Gestión Ambiental - ISO 14001">
  <defs>
    <marker id="arr14_file" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0D9488"/>
    </marker>
  </defs>

  <!-- Aspectos -->
  <rect x="20" y="20" width="110" height="55" rx="12" fill="#0D9488" opacity="0.9"/>
  <text x="75" y="43" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="10" font-weight="700" fill="white">Aspectos</text>
  <text x="75" y="57" text-anchor="middle" font-family="'Inter',sans-serif" font-size="8" fill="rgba(255,255,255,0.85)">Ambientales</text>

  <!-- Impactos -->
  <rect x="170" y="20" width="110" height="55" rx="12" fill="#0085CA" opacity="0.9"/>
  <text x="225" y="43" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="10" font-weight="700" fill="white">Impactos</text>
  <text x="225" y="57" text-anchor="middle" font-family="'Inter',sans-serif" font-size="8" fill="rgba(255,255,255,0.85)">Ambientales</text>

  <!-- Objetivos -->
  <rect x="170" y="195" width="110" height="55" rx="12" fill="#7C3AED" opacity="0.85"/>
  <text x="225" y="218" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="10" font-weight="700" fill="white">Objetivos</text>
  <text x="225" y="232" text-anchor="middle" font-family="'Inter',sans-serif" font-size="8" fill="rgba(255,255,255,0.85)">Ambientales</text>

  <!-- Mejora -->
  <rect x="20" y="195" width="110" height="55" rx="12" fill="#EA580C" opacity="0.85"/>
  <text x="75" y="218" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="10" font-weight="700" fill="white">Mejora</text>
  <text x="75" y="232" text-anchor="middle" font-family="'Inter',sans-serif" font-size="8" fill="rgba(255,255,255,0.85)">Continua</text>

  <!-- Flechas circulares -->
  <path d="M 130,47 L 170,47" stroke="#0D9488" stroke-width="2" marker-end="url(#arr14_file)" fill="none"/>
  <path d="M 225,75 L 225,195" stroke="#0085CA" stroke-width="2" marker-end="url(#arr14_file)" fill="none"/>
  <path d="M 170,222 L 130,222" stroke="#7C3AED" stroke-width="2" marker-end="url(#arr14_file)" fill="none"/>
  <path d="M 75,195 L 75,75" stroke="#EA580C" stroke-width="2" marker-end="url(#arr14_file)" fill="none"/>

  <!-- Centro SGA -->
  <rect x="110" y="108" width="80" height="40" rx="10" fill="white" stroke="#CBD5E1" stroke-width="1"/>
  <text x="150" y="124" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="9" font-weight="700" fill="#0B2545">SGA</text>
  <text x="150" y="138" text-anchor="middle" font-family="'Inter',sans-serif" font-size="7.5" fill="#64748B">ISO 14001</text>
</svg>
