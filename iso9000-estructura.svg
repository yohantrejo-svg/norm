<svg viewBox="0 0 320 310" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="7 Principios de Gestión de la Calidad - ISO 9000">
  <!-- Conexiones -->
  <line x1="160" y1="155" x2="160" y2="55"  stroke="#0085CA" stroke-width="1.5" opacity="0.4"/>
  <line x1="160" y1="155" x2="248" y2="88"  stroke="#0085CA" stroke-width="1.5" opacity="0.4"/>
  <line x1="160" y1="155" x2="262" y2="195" stroke="#0085CA" stroke-width="1.5" opacity="0.4"/>
  <line x1="160" y1="155" x2="195" y2="265" stroke="#0085CA" stroke-width="1.5" opacity="0.4"/>
  <line x1="160" y1="155" x2="122" y2="265" stroke="#0085CA" stroke-width="1.5" opacity="0.4"/>
  <line x1="160" y1="155" x2="58"  y2="195" stroke="#0085CA" stroke-width="1.5" opacity="0.4"/>
  <line x1="160" y1="155" x2="72"  y2="88"  stroke="#0085CA" stroke-width="1.5" opacity="0.4"/>

  <!-- Círculo central -->
  <circle cx="160" cy="155" r="40" fill="#0085CA"/>
  <text x="160" y="150" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="9" font-weight="700" fill="white">7 Principios</text>
  <text x="160" y="163" text-anchor="middle" font-family="'Inter',sans-serif" font-size="8" fill="rgba(255,255,255,0.85)">Gestión de Calidad</text>

  <!-- 1. Enfoque al cliente -->
  <circle cx="160" cy="45" r="35" fill="#EFF8FF" stroke="#0085CA" stroke-width="1.5"/>
  <text x="160" y="40" text-anchor="middle" font-family="'Inter',sans-serif" font-size="7.5" font-weight="600" fill="#0085CA">Enfoque</text>
  <text x="160" y="51" text-anchor="middle" font-family="'Inter',sans-serif" font-size="7.5" font-weight="600" fill="#0085CA">al Cliente</text>

  <!-- 2. Liderazgo -->
  <circle cx="252" cy="78" r="35" fill="#EFF8FF" stroke="#0085CA" stroke-width="1.5"/>
  <text x="252" y="79" text-anchor="middle" font-family="'Inter',sans-serif" font-size="8" font-weight="600" fill="#0085CA">Liderazgo</text>

  <!-- 3. Compromiso personas -->
  <circle cx="270" cy="195" r="35" fill="#EFF8FF" stroke="#0085CA" stroke-width="1.5"/>
  <text x="270" y="190" text-anchor="middle" font-family="'Inter',sans-serif" font-size="7.5" font-weight="600" fill="#0085CA">Compromiso</text>
  <text x="270" y="201" text-anchor="middle" font-family="'Inter',sans-serif" font-size="7.5" font-weight="600" fill="#0085CA">Personas</text>

  <!-- 4. Enfoque procesos -->
  <circle cx="204" cy="272" r="35" fill="#EFF8FF" stroke="#0085CA" stroke-width="1.5"/>
  <text x="204" y="267" text-anchor="middle" font-family="'Inter',sans-serif" font-size="7.5" font-weight="600" fill="#0085CA">Enfoque</text>
  <text x="204" y="278" text-anchor="middle" font-family="'Inter',sans-serif" font-size="7.5" font-weight="600" fill="#0085CA">Procesos</text>

  <!-- 5. Mejora -->
  <circle cx="116" cy="272" r="35" fill="#EFF8FF" stroke="#0085CA" stroke-width="1.5"/>
  <text x="116" y="276" text-anchor="middle" font-family="'Inter',sans-serif" font-size="8" font-weight="600" fill="#0085CA">Mejora</text>

  <!-- 6. Decisiones evidencia -->
  <circle cx="50" cy="195" r="35" fill="#EFF8FF" stroke="#0085CA" stroke-width="1.5"/>
  <text x="50" y="190" text-anchor="middle" font-family="'Inter',sans-serif" font-size="7.5" font-weight="600" fill="#0085CA">Decisiones</text>
  <text x="50" y="201" text-anchor="middle" font-family="'Inter',sans-serif" font-size="7.5" font-weight="600" fill="#0085CA">Evidencia</text>

  <!-- 7. Gestión relaciones -->
  <circle cx="68" cy="78" r="35" fill="#EFF8FF" stroke="#0085CA" stroke-width="1.5"/>
  <text x="68" y="73" text-anchor="middle" font-family="'Inter',sans-serif" font-size="7.5" font-weight="600" fill="#0085CA">Gestión</text>
  <text x="68" y="84" text-anchor="middle" font-family="'Inter',sans-serif" font-size="7.5" font-weight="600" fill="#0085CA">Relaciones</text>
</svg>
