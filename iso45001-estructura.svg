<svg viewBox="0 0 300 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Jerarquía de Controles de Seguridad y Salud - ISO 45001">
  <!-- Nivel 1: Eliminación -->
  <polygon points="40,10 260,10 230,52 70,52" fill="#EA580C" opacity="0.95"/>
  <text x="150" y="34" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="11" font-weight="700" fill="white">Eliminación</text>

  <!-- Nivel 2: Sustitución -->
  <polygon points="70,56 230,56 205,96 95,96" fill="#EA580C" opacity="0.78"/>
  <text x="150" y="79" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="10" font-weight="700" fill="white">Sustitución</text>

  <!-- Nivel 3: Controles de ingeniería -->
  <polygon points="95,100 205,100 180,140 120,140" fill="#F59E0B" opacity="0.9"/>
  <text x="150" y="122" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="9" font-weight="700" fill="white">Ing. Control</text>

  <!-- Nivel 4: Controles administrativos -->
  <polygon points="120,144 180,144 165,184 135,184" fill="#0D9488" opacity="0.85"/>
  <text x="150" y="167" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="9" font-weight="700" fill="white">Administrat.</text>

  <!-- Nivel 5: EPP -->
  <polygon points="135,188 165,188 158,220 142,220" fill="#0085CA" opacity="0.8"/>
  <text x="150" y="208" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-size="8" font-weight="700" fill="white">EPP</text>

  <text x="22" y="34" font-family="'Inter',sans-serif" font-size="7" fill="#EA580C" font-weight="600">↑ Más</text>
  <text x="16" y="44" font-family="'Inter',sans-serif" font-size="7" fill="#EA580C" font-weight="600">efectivo</text>
  <text x="13" y="210" font-family="'Inter',sans-serif" font-size="7" fill="#64748B" font-weight="600">↓ Menos</text>
  <text x="10" y="220" font-family="'Inter',sans-serif" font-size="7" fill="#64748B" font-weight="600">efectivo</text>
</svg>
